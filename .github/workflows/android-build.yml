name: Android Build & APK Generation

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'APK_DOWNLOAD/**'
      - '.build-outputs/**'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate and Validate Real Debug APK
        id: validate_apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated at $APK_PATH"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$APK_PATH")
          echo "Generated APK size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "ERROR: APK size is unexpectedly small ($FILE_SIZE bytes). Build may be corrupt."
            exit 1
          fi

          # Verify APK is a valid ZIP archive containing AndroidManifest.xml and classes.dex
          unzip -t "$APK_PATH"
          unzip -l "$APK_PATH" | grep -E "AndroidManifest.xml|classes.dex"

          # Prepare output directories
          mkdir -p .build-outputs
          mkdir -p APK_DOWNLOAD

          cp "$APK_PATH" .build-outputs/app-debug.apk
          cp "$APK_PATH" APK_DOWNLOAD/app-debug.apk

          # Verify SHA256 matches exactly
          HASH1=$(sha256sum .build-outputs/app-debug.apk | awk '{print $1}')
          HASH2=$(sha256sum APK_DOWNLOAD/app-debug.apk | awk '{print $1}')
          echo "SHA256 (.build-outputs): $HASH1"
          echo "SHA256 (APK_DOWNLOAD):  $HASH2"

          if [ "$HASH1" != "$HASH2" ]; then
            echo "ERROR: SHA256 checksum mismatch between copied APKs!"
            exit 1
          fi

          echo "APK Validation Successful!"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: APK_DOWNLOAD/app-debug.apk
          retention-days: 30

      - name: Commit and Push APK to Repository
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .build-outputs/app-debug.apk
          git add -f APK_DOWNLOAD/app-debug.apk
          if git diff --cached --quiet; then
            echo "No APK changes to commit."
          else
            git commit -m "build: update verified debug APK [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi
