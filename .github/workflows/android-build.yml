name: Android Build & APK Generation

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'APK_DOWNLOAD/**'
      - '.build-outputs/**'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK & Validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "Setting up Android SDK environment at $ANDROID_HOME..."
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate and Validate Real Debug APK
        id: validate_apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated at $APK_PATH"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$APK_PATH")
          echo "Generated APK size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "ERROR: APK size is unexpectedly small ($FILE_SIZE bytes). Build may be corrupt."
            exit 1
          fi

          # Verify APK is a valid ZIP archive containing AndroidManifest.xml and classes.dex
          unzip -t "$APK_PATH"
          unzip -l "$APK_PATH" | grep -E "AndroidManifest.xml|classes.dex"

          # Prepare output directories
          mkdir -p .build-outputs
          mkdir -p APK_DOWNLOAD

          cp "$APK_PATH" .build-outputs/app-debug.apk
          cp "$APK_PATH" APK_DOWNLOAD/app-debug.apk

          # Verify SHA256 matches exactly
          HASH1=$(sha256sum .build-outputs/app-debug.apk | awk '{print $1}')
          HASH2=$(sha256sum APK_DOWNLOAD/app-debug.apk | awk '{print $1}')
          echo "SHA256 (.build-outputs): $HASH1"
          echo "SHA256 (APK_DOWNLOAD):  $HASH2"

          if [ "$HASH1" != "$HASH2" ]; then
            echo "ERROR: SHA256 checksum mismatch between copied APKs!"
            exit 1
          fi

          # Verify and record build against the exact Git commit SHA
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1 | sed 's/"/\\"/g')
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "Verifying APK against latest source commit: $COMMIT_SHA"
          cat <<EOF > APK_DOWNLOAD/build-info.json
{
  "commit_sha": "$COMMIT_SHA",
  "commit_message": "$COMMIT_MSG",
  "author": "$COMMIT_AUTHOR",
  "build_timestamp": "$BUILD_DATE",
  "apk_sha256": "$HASH2",
  "apk_size_bytes": $FILE_SIZE,
  "verified_against_commit": true
}
EOF
          cp APK_DOWNLOAD/build-info.json .build-outputs/build-info.json
          echo "APK Validation & Source Commit Verification Successful!"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            APK_DOWNLOAD/app-debug.apk
            APK_DOWNLOAD/build-info.json
          retention-days: 30

      - name: Commit and Push APK to Repository
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .build-outputs/app-debug.apk
          git add -f .build-outputs/build-info.json
          git add -f APK_DOWNLOAD/app-debug.apk
          git add -f APK_DOWNLOAD/build-info.json
          if git diff --cached --quiet; then
            echo "No APK changes to commit."
          else
            git commit -m "build: update verified debug APK with commit metadata [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi
